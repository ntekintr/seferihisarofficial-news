name: Daily state backup and restore drill
on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['seferihisar/state_backup.py', 'seferihisar/backup_history.py', '.github/workflows/state-backup.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: seferihisar-state-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Capture one immutable state commit and restore it in a temporary directory
        run: python -m seferihisar.state_backup capture
      - name: Also restore a previous day's successful backup when available
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m seferihisar.backup_history
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-state-backup
          path: work/state-backup
          if-no-files-found: error
          retention-days: 7
