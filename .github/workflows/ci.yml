name: Validate platform
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install and verify local illustration text checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
          tesseract --version
      - run: python -m pytest -q
      - run: node --check site/app.js
      - run: node --test ops/cron-worker.test.mjs site/app.test.mjs
      - run: python -m seferihisar.cli demo --public work/demo-site
      - run: python -m seferihisar.security public work/demo-site

