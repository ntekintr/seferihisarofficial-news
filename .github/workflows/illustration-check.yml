name: Test free cloud illustration (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seferihisar-illustration-test
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install local illustration lettering check (no external AI request)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
      - name: Generate one free example and render feed and story
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ILLUSTRATIONS_ENABLED: 'true'
        run: python -m seferihisar.illustrations --preview work/illustration-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: free-illustration-preview
          path: |
            work/illustration-preview/feed.jpg
            work/illustration-preview/story.jpg
          if-no-files-found: error
          retention-days: 2
