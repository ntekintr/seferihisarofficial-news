name: Daily Seferihisar duty pharmacy story
on:
  workflow_dispatch: # One preview only; this event cannot run the publication job.
  schedule:
    - cron: '35 13 * * *' # 16:35 TR; only a current deployed list waits until 17:00.
    - cron: '0,17,32,47 14 * * *' # 17:00 target and bounded same-hour backups.
  workflow_run:
    workflows: ['Research and prepare Seferihisar content']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ntekintr/seferihisarofficial-news' && github.ref == 'refs/heads/main'
    concurrency:
      group: seferihisar-pharmacy-preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: python -m seferihisar.pharmacy_source --preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pharmacy-preview-${{ github.run_id }}
          path: work/pharmacy-preview
          retention-days: 3
  pharmacy:
    if: >-
      github.repository == 'ntekintr/seferihisarofficial-news' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (contains(github.event.workflow_run.created_at, 'T13:') || contains(github.event.workflow_run.created_at, 'T14:'))))
    # Job-level lock: skipped runs outside 16:00-17:59 TR must not evict a pending real job.
    concurrency:
      group: seferihisar-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: instagram-production
    permissions:
      contents: write
    env:
      INSTAGRAM_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED }}
      META_TESTS_COMPLETED: ${{ vars.META_TESTS_COMPLETED }}
      INSTAGRAM_AUTH_MODE: facebook_login
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - id: restore
        run: python -m seferihisar.state_git restore
      - name: Publish today's verified and deployed list once at 17:00 TR
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m seferihisar.pharmacy --wait-for-target
      - name: Observe recorded pharmacy story membership with GET only
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m seferihisar.pharmacy --observe-only
      - name: Preserve every claim and observation without replay
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.state_git persist
