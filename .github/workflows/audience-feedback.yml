name: Learn from published Instagram content (GET only)
on:
  schedule:
    - cron: '11 1 * * *' # 04:11 Istanbul; outside weather/news windows.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seferihisar/learning.py'
      - '.github/workflows/audience-feedback.yml'
  workflow_run:
    workflows: ['Research and prepare Seferihisar content']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: seferihisar-production
  cancel-in-progress: false
jobs:
  feedback:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(github.event.workflow_run.created_at, 'T01:')))
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: instagram-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Restore serialized public-safe state
        id: restore
        run: python -m seferihisar.state_git restore
      - name: Read existing account insights; persist only coarse topic preferences
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m seferihisar.learning
      - name: Persist controlled feedback; never retry a publication
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.state_git persist
