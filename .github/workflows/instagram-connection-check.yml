name: Test Instagram cloud connection (no publication)
on:
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * *' # 08:10 Türkiye, before the first publication window.
  workflow_run:
    workflows: ['Research and prepare Seferihisar content']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'seferihisar/connection_health.py'
      - '.github/workflows/instagram-connection-check.yml'
permissions:
  contents: read
jobs:
  connection:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(github.event.workflow_run.created_at, 'T05:')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: instagram-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify existing Instagram and Facebook connections using GET only
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PUBLISH_ENABLED: ${{ vars.FACEBOOK_PUBLISH_ENABLED }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m seferihisar.connection_health
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meta-connection-health
          path: work/connection-health/summary.json
          if-no-files-found: error
          retention-days: 7
