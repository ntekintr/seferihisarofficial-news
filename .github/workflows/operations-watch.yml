name: Independent operations watch
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Research and prepare Seferihisar content', 'Controlled Instagram publication', 'Test Instagram cloud connection (no publication)', 'Daily Seferihisar weather story', 'Daily state backup and restore drill']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  watch:
    # GitHub drops most of the hourly schedule (30 Oct: 12:45, then nothing for
    # 2+ h), so every completed research run is also observed, not only failures.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.name == 'Research and prepare Seferihisar content' ||
         github.event.workflow_run.name == 'Daily state backup and restore drill')))
    # Job-level lock: watch runs skipped after a successful publication must not
    # evict the pending check of a research run.
    concurrency:
      group: seferihisar-operations-watch
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read public health and notify the owner only on incident transitions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m seferihisar.ops_watch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operations-watch
          path: work/operations-watch/summary.json
          if-no-files-found: error
          retention-days: 7
