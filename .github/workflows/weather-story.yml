name: Daily Seferihisar weather story
on:
  schedule:
    - cron: '0 5 * * *' # 08:00 Europe/Istanbul. GitHub can delay execution.
  workflow_run:
    workflows: ['Research and prepare Seferihisar content']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: seferihisar-production
  cancel-in-progress: false
jobs:
  weather:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (contains(github.event.workflow_run.created_at, 'T04:') || contains(github.event.workflow_run.created_at, 'T05:'))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: instagram-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - id: restore
        run: python -m seferihisar.state_git restore
      - name: Publish this morning's deployed weather card once
        env:
          INSTAGRAM_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED }}
          META_TESTS_COMPLETED: ${{ vars.META_TESTS_COMPLETED }}
          INSTAGRAM_AUTH_MODE: facebook_login
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          SITE_URL: ${{ vars.SITE_URL }}
          STATE_GIT_CHECKPOINT: 'true'
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.weather
      - name: Persist the result without replaying uncertain publications
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.state_git persist
