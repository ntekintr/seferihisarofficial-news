name: Research and prepare Seferihisar content
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: seferihisar-production
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Restore durable state (never use expiring cache as database)
        id: restore
        run: python -m seferihisar.state_git restore
      - name: Collect, verify and prepare (no Instagram publication)
        run: python -m seferihisar.cli run
      - name: Persist state even if a later render/deploy fails
        if: always() && steps.restore.outcome == 'success'
        run: python -m seferihisar.state_git persist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
