name: Research and prepare Seferihisar content
on:
  push:
    branches: [main]
    paths:
      - 'seferihisar/**'
      - 'config/**'
      - 'site/**'
      - '.github/workflows/automation.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seferihisar-production
  cancel-in-progress: false
jobs:
  instagram_sources:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    continue-on-error: true # Web research continues if this optional source job fails.
    environment: instagram-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Read public professional-account captions (GET only)
        env:
          IG_SOURCE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_SOURCE_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
        run: python -m seferihisar.instagram_sources
      - name: Read optional single news photos (GET only; caption failures stay isolated)
        continue-on-error: true
        env:
          IG_SOURCE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_SOURCE_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
        run: python -m seferihisar.instagram_source_photos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-instagram-sources
          path: |
            work/instagram-sources/public.json
            work/instagram-sources/photos.json
            work/instagram-sources/photos/*.jpg
          if-no-files-found: error
          retention-days: 1

  research:
    needs: instagram_sources
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Collect alone took 506–736 s on 30 Oct; at 14 min one run was cut off
    # before persist. Runs queue (cancel-in-progress: false), so this only
    # gives a slow crawl room to finish.
    timeout-minutes: 20
    outputs:
      feedback_due: ${{ steps.feedback_due.outputs.due }}
    env:
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      PUBLISHING_CONFIGURED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED == 'true' && vars.META_TESTS_COMPLETED == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - name: Install local illustration lettering check (no external AI request)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/visual-model
          key: clip-cpu-3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
      - name: Set up local image-subject check (failure uses information cards)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[visual]'
          python -m seferihisar.visual_match --download
      - name: Restore durable state (never use expiring cache as database)
        id: restore
        run: python -m seferihisar.state_git restore
      - name: Decide daily feedback without account credentials or network reads
        id: feedback_due
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from seferihisar.domain import now
          from seferihisar.learning import due
          from seferihisar.store import Store
          store = Store('state/platform.sqlite')
          try:
              needed = due(store, now())
          finally:
              store.close()
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('due=' + str(needed).lower() + '\n')
          PY
      - name: Read only this run's validated public Instagram manifest
        if: needs.instagram_sources.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-instagram-sources
          path: work/instagram-sources
      - name: Collect, verify and prepare (no Instagram publication)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ILLUSTRATIONS_ENABLED: 'true'
          ILLUSTRATION_REVIEW_ENABLED: 'true'
        run: python -m seferihisar.cli run --instagram-manifest work/instagram-sources/public.json
      - name: Validate both public boundaries before upload
        run: |
          python -m seferihisar.security state state/platform.sqlite
          python -m seferihisar.security public dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-safe-state
          path: state/platform.sqlite
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Retain bounded rejected-image evidence for review only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: illustration-review
          path: work/illustration-review
          if-no-files-found: ignore
          retention-days: 3

  persist:
    needs: research
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Only this job writes the isolated automation-state branch.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-safe-state
          path: state
      - name: Revalidate and persist (standard library only; no crawling or AI)
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.state_git persist

  feedback:
    needs: [research, persist]
    if: needs.research.outputs.feedback_due == 'true'
    continue-on-error: true # Insights access is optional; news publication continues.
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: instagram-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Restore serialized public-safe state
        id: restore
        run: python -m seferihisar.state_git restore
      - name: Read own-account insights using GET only; retain no raw measurements
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
        run: python -m seferihisar.learning
      - name: Persist coarse feedback even when insights are unavailable
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m seferihisar.state_git persist

  deploy:
    needs: [research, persist]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write # Required only for the Pages deployment API.
      id-token: write # Required only for the Pages OIDC deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

