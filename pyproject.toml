[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seferihisar-official"
version = "0.1.0"
description = "Kaynak odaklı Seferihisar haber ve gelecek etkinlik otomasyonu"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
seferihisar = "seferihisar.cli:main"

[tool.setuptools.packages.find]
include = ["seferihisar*"]

[tool.setuptools.package-data]
seferihisar = ["assets/*.png", "assets/*.jpg", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
